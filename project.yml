name: TerminalRelay

options:
  bundleIdPrefix: com.mpieras
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.14.1
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.101.3
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.5.1
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView.git
    exactVersion: 3.0.0
    traits: []

targets:
  TerminalRelay:
    type: application
    platform: macOS
    sources:
      - path: TerminalRelay
      - path: Shared/Chat
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: TerminalRelay/Info.plist
      properties:
        CFBundleDisplayName: Terminal Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.mpieras.TerminalRelay.worker-registration
            CFBundleURLSchemes:
              - terminal-relay
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUEnableSystemProfiling: false
        SUFeedURL: https://miguelpieras.github.io/terminal-relay/appcast.xml
        SUPublicEDKey: v0p1N1q4J2BUKlqOx8GpDSwJTJYWZrFvkAyMXdLSesQ=
        SURequireSignedFeed: true
        SUScheduledCheckInterval: 86400
        SUSignedFeedFailureExpirationInterval: 0
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Sparkle
      - package: SwiftTerm
      - package: MarkdownView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelay
        PRODUCT_NAME: Terminal Relay
        PRODUCT_MODULE_NAME: TerminalRelay
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleName: Terminal Relay
        INFOPLIST_KEY_CFBundleDisplayName: Terminal Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  TerminalRelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TerminalRelayTests
    dependencies:
      - target: TerminalRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Terminal Relay.app/Contents/MacOS/Terminal Relay
        BUNDLE_LOADER: $(TEST_HOST)

  TerminalRelayIOS:
    type: application
    platform: iOS
    sources:
      - path: TerminalRelayIOS
      - path: Shared/Chat
      - path: TerminalRelay/Models/AgentKind.swift
      - path: TerminalRelay/Models/AgentLaunchDefaults.swift
      - path: TerminalRelay/Models/MobilePairingPayload.swift
      - path: TerminalRelay/Models/WorkerSessionState.swift
      - path: TerminalRelay/Models/WorkerChatState.swift
      - path: TerminalRelay/Models/WorkerThreadState.swift
      - path: TerminalRelay/Models/WorkerUpdateStatus.swift
      - path: TerminalRelay/Models/WorkerRuntimeStatus.swift
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: MarkdownView
    info:
      path: TerminalRelayIOS/Info.plist
      properties:
        CFBundleDisplayName: Terminal Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSCameraUsageDescription: Scan a private pairing code shown by Terminal Relay on your Mac.
        NSLocalNetworkUsageDescription: Terminal Relay connects to your worker over Tailscale.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelay.iOS
        PRODUCT_NAME: Terminal Relay
        PRODUCT_MODULE_NAME: TerminalRelayIOS
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 10
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6EBZ756H9Q

  TerminalRelayIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TerminalRelayIOSTests
    dependencies:
      - target: TerminalRelayIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayIOSTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: 6EBZ756H9Q
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Terminal Relay.app/Terminal Relay
        BUNDLE_LOADER: $(TEST_HOST)

  TerminalRelayIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TerminalRelayIOSUITests
    dependencies:
      - target: TerminalRelayIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayIOSUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: 6EBZ756H9Q
        TEST_TARGET_NAME: TerminalRelayIOS

schemes:
  TerminalRelay:
    build:
      targets:
        TerminalRelay: all
        TerminalRelayTests: [test]
    test:
      targets:
        - TerminalRelayTests

  TerminalRelayIOS:
    build:
      targets:
        TerminalRelayIOS: all
        TerminalRelayIOSTests: [test]
        TerminalRelayIOSUITests: [test]
    test:
      targets:
        - TerminalRelayIOSTests
        - TerminalRelayIOSUITests
