name: TerminalRelay

options:
  bundleIdPrefix: com.miguelpieras
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0

targets:
  TerminalRelay:
    type: application
    platform: macOS
    sources:
      - path: TerminalRelay
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelay
        PRODUCT_NAME: Terminal Relay
        PRODUCT_MODULE_NAME: TerminalRelay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: Terminal Relay
        INFOPLIST_KEY_CFBundleDisplayName: Terminal Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  TerminalRelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TerminalRelayTests
    dependencies:
      - target: TerminalRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Terminal Relay.app/Contents/MacOS/Terminal Relay
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  TerminalRelay:
    build:
      targets:
        TerminalRelay: all
        TerminalRelayTests: [test]
    test:
      targets:
        - TerminalRelayTests
