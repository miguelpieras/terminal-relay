name: AgentConsole

options:
  bundleIdPrefix: com.miguelpieras
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0

targets:
  AgentConsole:
    type: application
    platform: macOS
    sources:
      - path: AgentConsole
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelpieras.AgentConsole
        PRODUCT_MODULE_NAME: AgentConsole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Console
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  AgentConsoleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentConsoleTests
    dependencies:
      - target: AgentConsole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelpieras.AgentConsoleTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0

schemes:
  AgentConsole:
    build:
      targets:
        AgentConsole: all
        AgentConsoleTests: [test]
    test:
      targets:
        - AgentConsoleTests
