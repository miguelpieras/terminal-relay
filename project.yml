name: TerminalRelay

options:
  bundleIdPrefix: com.miguelpieras
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.12.0
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.92.2

targets:
  TerminalRelay:
    type: application
    platform: macOS
    sources:
      - path: TerminalRelay
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelay
        PRODUCT_NAME: Terminal Relay
        PRODUCT_MODULE_NAME: TerminalRelay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: Terminal Relay
        INFOPLIST_KEY_CFBundleDisplayName: Terminal Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  TerminalRelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TerminalRelayTests
    dependencies:
      - target: TerminalRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Terminal Relay.app/Contents/MacOS/Terminal Relay
        BUNDLE_LOADER: $(TEST_HOST)

  TerminalRelayIOS:
    type: application
    platform: iOS
    sources:
      - path: TerminalRelayIOS
      - path: TerminalRelay/Models/AgentKind.swift
      - path: TerminalRelay/Models/AgentLaunchDefaults.swift
      - path: TerminalRelay/Models/WorkerSessionState.swift
    dependencies:
      - package: SwiftTerm
      - package: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelay.iOS
        PRODUCT_NAME: Terminal Relay
        PRODUCT_MODULE_NAME: TerminalRelayIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: Terminal Relay
        INFOPLIST_KEY_CFBundleDisplayName: Terminal Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Terminal Relay connects to your worker over Tailscale.
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  TerminalRelayIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TerminalRelayIOSTests
    dependencies:
      - target: TerminalRelayIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpieras.TerminalRelayIOSTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Terminal Relay.app/Terminal Relay
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  TerminalRelay:
    build:
      targets:
        TerminalRelay: all
        TerminalRelayTests: [test]
    test:
      targets:
        - TerminalRelayTests

  TerminalRelayIOS:
    build:
      targets:
        TerminalRelayIOS: all
        TerminalRelayIOSTests: [test]
    test:
      targets:
        - TerminalRelayIOSTests
