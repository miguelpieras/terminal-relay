name: Bug report
description: Report a reproducible Terminal Relay problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private addresses, account details, or terminal contents. Report security issues privately through the Security tab.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0 (3)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 26.2 or iOS 26.2
    validations:
      required: true
