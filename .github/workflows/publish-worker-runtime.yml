name: Publish Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-worker-runtime.yml
      - Scripts/build-worker-runtime.sh
      - Scripts/worker-runtime-version.sh
      - Server/worker-runtime-files.txt
      - Server/terminal-relay-session
      - Server/terminal-relay-mcp
      - Server/terminal-relay-chat
      - Server/terminal-relay-claude-sessions
      - Server/claude-agent-sdk-requirements.txt
      - Server/terminal-relay-session-restore@.service
      - Server/terminal-relay-agent-update
      - Server/terminal-relay-agent-update.service
      - Server/terminal-relay-agent-update.timer
      - Server/terminal-relay-runtime-update
      - Server/terminal-relay-runtime-update.service
      - Server/terminal-relay-runtime-update.timer
      - Server/terminal-relay-runtime-update.path
      - Server/terminal-relay-runtime-update.pub
      - Server/terminal-relay-review-gateway
      - Server/terminal-relay-mobile-gateway
  workflow_dispatch:

permissions: {}

concurrency:
  group: terminal-relay-worker-runtime-stable
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: macos-26
    timeout-minutes: 20
    environment: macos-release
    permissions:
      contents: read
      pages: write
    outputs:
      runtime-version: ${{ steps.runtime.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate current main commit
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          git fetch --quiet origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]

      - name: Check public repository
        run: ./Scripts/check-public-repo.sh

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Test worker runtime publication
        run: |
          ./Server/Tests/worker-runtime-update-tests.sh
          ./Server/Tests/stable-runtime-preflight-tests.sh

      - name: Prepare worker runtime signing key
        id: runtime-key
        env:
          WORKER_RUNTIME_SIGNING_KEY: ${{ secrets.WORKER_RUNTIME_SIGNING_KEY }}
        run: |
          key_path="$RUNNER_TEMP/worker-runtime-signing.pem"
          printf '%s' "$WORKER_RUNTIME_SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"
          /opt/homebrew/opt/openssl@3/bin/openssl pkey \
            -in "$key_path" \
            -pubout \
            -out "$RUNNER_TEMP/worker-runtime-public.pem"
          cmp -s \
            "$RUNNER_TEMP/worker-runtime-public.pem" \
            Server/terminal-relay-runtime-update.pub
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build signed worker runtime
        id: runtime
        env:
          WORKER_RUNTIME_SIGNING_KEY_PATH: ${{ steps.runtime-key.outputs.path }}
          OPENSSL_BIN: /opt/homebrew/opt/openssl@3/bin/openssl
        run: |
          runtime_version="$(./Scripts/worker-runtime-version.sh)"
          release_version=$(
            awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml
          )
          output_directory="$GITHUB_WORKSPACE/build/worker-runtime"
          ./Scripts/build-worker-runtime.sh \
            "$runtime_version" \
            "$release_version" \
            "$output_directory"
          echo "version=$runtime_version" >> "$GITHUB_OUTPUT"

      - name: Preserve client feed and stage runtime feed
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          pages_directory="$GITHUB_WORKSPACE/build/worker-runtime-pages"
          runtime_directory="$GITHUB_WORKSPACE/build/worker-runtime"
          mkdir -p "$pages_directory/worker-runtime/$RUNTIME_VERSION"
          cp -R docs/. "$pages_directory/"
          feed_root="https://miguelpieras.github.io/terminal-relay"
          live_appcast="$RUNNER_TEMP/live-appcast.xml"
          if ! live_status="$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --location \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            --write-out '%{http_code}' \
            --output "$live_appcast" \
            "$feed_root/appcast.xml")"; then
            echo "could not read the published Sparkle appcast" >&2
            exit 1
          fi
          if [[ "$live_status" != "200" && "$live_status" != "404" ]]; then
            echo "could not read the published Sparkle appcast (HTTP $live_status)" >&2
            exit 1
          fi
          if [[ "$live_status" == "200" ]]; then
            cp "$live_appcast" "$pages_directory/appcast.xml"
            /usr/bin/python3 - "$live_appcast" > "$RUNNER_TEMP/live-archives.txt" <<'PYTHON'
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          prefix = "https://miguelpieras.github.io/terminal-relay/"
          names = []
          for item in root.iter():
              if not item.tag.endswith("enclosure"):
                  continue
              url = item.attrib.get("url", "")
              if not url.startswith(prefix):
                  raise SystemExit("published Sparkle archive URL is invalid")
              name = url.removeprefix(prefix)
              if not re.fullmatch(r"Terminal-Relay-[0-9]+(?:\.[0-9]+){1,2}\.zip", name):
                  raise SystemExit("published Sparkle archive name is invalid")
              names.append(name)
          if not names:
              raise SystemExit("published Sparkle appcast has no enclosures")
          print("\n".join(names))
          PYTHON
            while IFS= read -r archive_name; do
              [[ -n "$archive_name" ]] || continue
              if ! archive_status="$(curl \
                --proto '=https' \
                --tlsv1.2 \
                --location \
                --silent \
                --show-error \
                --retry 6 \
                --retry-all-errors \
                --retry-delay 5 \
                --max-time 60 \
                --write-out '%{http_code}' \
                --output "$pages_directory/$archive_name.download" \
                "$feed_root/$archive_name")"; then
                echo "could not download published archive $archive_name" >&2
                exit 1
              fi
              if [[ "$archive_status" == "200" ]]; then
                mv "$pages_directory/$archive_name.download" \
                  "$pages_directory/$archive_name"
              elif [[ "$archive_status" == "404" ]]; then
                rm -f "$pages_directory/$archive_name.download"
                echo "warning: live feed lists $archive_name but does not host it;" \
                  "keeping any tracked copy" >&2
              else
                echo "could not download published archive $archive_name (HTTP $archive_status)" >&2
                exit 1
              fi
            done < "$RUNNER_TEMP/live-archives.txt"
          fi
          cp "$runtime_directory/manifest.json" \
            "$pages_directory/worker-runtime/manifest.json"
          cp "$runtime_directory/manifest.sig" \
            "$pages_directory/worker-runtime/manifest.sig"
          cp "$runtime_directory/runtime.tar.gz" \
            "$pages_directory/worker-runtime/$RUNTIME_VERSION/runtime.tar.gz"
          /usr/bin/python3 - "$pages_directory" "$RUNTIME_VERSION" <<'PYTHON'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          pages = pathlib.Path(sys.argv[1])
          version = int(sys.argv[2])
          appcast = pages / "appcast.xml"
          if not appcast.is_file():
              raise SystemExit("published Sparkle appcast is missing")
          root = ET.parse(appcast).getroot()
          urls = [
              item.attrib.get("url", "")
              for item in root.iter()
              if item.tag.endswith("enclosure")
          ]
          expected_prefix = "https://miguelpieras.github.io/terminal-relay/"
          if not urls or any(not url.startswith(expected_prefix) for url in urls):
              raise SystemExit("published Sparkle archive URL is invalid")
          names = [url.removeprefix(expected_prefix) for url in urls]
          for name in names:
              if not re.fullmatch(r"Terminal-Relay-[0-9]+(?:\.[0-9]+){1,2}\.zip", name):
                  raise SystemExit("published Sparkle archive name is invalid")
          if not any((pages / name).is_file() for name in names):
              raise SystemExit("no published Sparkle archive is staged")
          for name in names:
              if not (pages / name).is_file():
                  print(
                      f"warning: staged feed lists {name} but no archive is staged",
                      file=sys.stderr,
                  )
          manifest_path = pages / "worker-runtime" / "manifest.json"
          archive_path = pages / "worker-runtime" / str(version) / "runtime.tar.gz"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if (
              manifest.get("runtimeVersion") != version
              or manifest.get("archiveURL")
              != (
                  "https://miguelpieras.github.io/terminal-relay/"
                  f"worker-runtime/{version}/runtime.tar.gz"
              )
              or manifest.get("archiveSHA256")
              != hashlib.sha256(archive_path.read_bytes()).hexdigest()
          ):
              raise SystemExit("staged worker runtime feed is inconsistent")
          PYTHON

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/worker-runtime-pages

  deploy-pages:
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy signed worker runtime
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published signature and archive
        env:
          RUNTIME_VERSION: ${{ needs.build-runtime.outputs.runtime-version }}
        run: |
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "$temporary_directory"' EXIT
          feed_root="https://miguelpieras.github.io/terminal-relay/worker-runtime"
          for name in manifest.json manifest.sig; do
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 15 \
              "$feed_root/$name" \
              --output "$temporary_directory/$name"
          done
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            "$feed_root/$RUNTIME_VERSION/runtime.tar.gz" \
            --output "$temporary_directory/runtime.tar.gz"
          openssl pkeyutl \
            -verify \
            -pubin \
            -inkey Server/terminal-relay-runtime-update.pub \
            -rawin \
            -in "$temporary_directory/manifest.json" \
            -sigfile "$temporary_directory/manifest.sig"
          /usr/bin/python3 - "$temporary_directory" "$RUNTIME_VERSION" <<'PYTHON'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          version = int(sys.argv[2])
          manifest = json.loads(
              (root / "manifest.json").read_text(encoding="utf-8")
          )
          archive = (root / "runtime.tar.gz").read_bytes()
          if (
              manifest.get("runtimeVersion") != version
              or manifest.get("archiveSHA256")
              != hashlib.sha256(archive).hexdigest()
          ):
              raise SystemExit("published worker runtime feed is inconsistent")
          PYTHON
